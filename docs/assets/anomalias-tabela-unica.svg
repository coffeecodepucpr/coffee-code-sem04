<text x="844" y="387" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#3B2A22" text-anchor="start" >ANOMALIA DE INSERÇÃO</text>
<text x="814" y="414" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="start" >Cada linha é uma participação, então</text>
<text x="814" y="436" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="start" >uma matéria sem participantes</text>
<text x="814" y="458" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="start" >não tem onde ser registrada.</text>
<text x="630.0" y="530" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7A553A" text-anchor="middle" >tudo que se repete na planilha é uma armadilha: a normalização existe para guardar cada informação uma vez só</text>
