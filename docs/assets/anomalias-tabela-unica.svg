<text x="814" y="142" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="start" >MAT101 aparece em duas linhas.</text>
<text x="814" y="164" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7A553A" text-anchor="start" >Mudar o código exige alterar todas;</text>
