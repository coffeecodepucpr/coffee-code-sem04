<svg viewBox="0 0 1180 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7A553A"/>
  </marker>
    
  </defs>
  <rect x="0" y="0" width="1180" height="560" fill="#E6D6C1"/>

<text x="590.0" y="32" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#7A553A" text-anchor="middle" >O QUE UM ORM FAZ ENTRE O SEU CÓDIGO E O BANCO</text>
<rect x="40" y="80" width="400" height="78" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="240.0" y="114" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >SEU CÓDIGO</text>
<text x="240.0" y="138" font-family="None" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >objetos: Grupo, Usuario</text>
<line x1="240.0" y1="161" x2="240.0" y2="189" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="192" width="400" height="78" rx="10" fill="#D6BFA6" stroke="#7A553A" stroke-width="2"/>
<text x="240.0" y="226" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >ORM</text>
<text x="240.0" y="250" font-family="None" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >SQLAlchemy ou Prisma Client</text>
<line x1="240.0" y1="273" x2="240.0" y2="301" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="304" width="400" height="78" rx="10" fill="#D6BFA6" stroke="#7A553A" stroke-width="2"/>
<text x="240.0" y="338" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >SQL GERADO</text>
<text x="240.0" y="362" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >select ... from grupos ...</text>
<line x1="240.0" y1="385" x2="240.0" y2="413" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="40" y="416" width="400" height="78" rx="10" fill="#B08968" stroke="#7A553A" stroke-width="2"/>
<text x="240.0" y="450" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#3B2A22" text-anchor="middle" >POSTGRESQL</text>
<text x="240.0" y="474" font-family="None" font-size="12" font-weight="600" fill="#7A553A" text-anchor="middle" >tabelas, linhas e colunas</text>
<text x="830.0" y="90" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#7A553A" text-anchor="middle" >A MESMA PERGUNTA, DOS DOIS LADOS</text>
<rect x="520" y="110" width="620" height="130" rx="10" fill="#3B2A22" stroke="#7A553A" stroke-width="2"/>
<text x="540" y="138" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#B08968" text-anchor="start" ># SQLAlchemy</text>
<text x="540" y="166" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#F3E9D7" text-anchor="start" xml:space="preserve">select(Grupo)</text>
<text x="540" y="190" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#F3E9D7" text-anchor="start" xml:space="preserve">  .where(Grupo.max_participantes &gt;= 6)</text>
<text x="540" y="214" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#F3E9D7" text-anchor="start" xml:space="preserve">  .order_by(Grupo.nome_grupo)</text>
<path d="M830.0,248 L830.0,286" stroke="#7A553A" stroke-width="3" marker-end="url(#arrow)"/>
<text x="844.0" y="273" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7A553A" text-anchor="start" >o ORM traduz</text>
<rect x="520" y="296" width="620" height="130" rx="10" fill="#3B2A22" stroke="#7A553A" stroke-width="2"/>
<text x="540" y="324" font-family="Consolas, monospace" font-size="12" font-weight="600" fill="#B08968" text-anchor="start" >-- SQL equivalente (simplificado)</text>
<text x="540" y="352" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#F3E9D7" text-anchor="start" xml:space="preserve">select grupo_id, nome_grupo, materia_id, max_participantes</text>
<text x="540" y="376" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#F3E9D7" text-anchor="start" xml:space="preserve">from grupos</text>
<text x="540" y="400" font-family="Consolas, monospace" font-size="13" font-weight="600" fill="#F3E9D7" text-anchor="start" xml:space="preserve">where max_participantes &gt;= 6 order by nome_grupo</text>
<text x="830.0" y="470" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >o ORM não substitui o SQL: ele escreve o SQL por você, e entender SQL</text>
<text x="830.0" y="492" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7A553A" text-anchor="middle" >é o que permite conferir se ele escreveu direito</text>
</svg>