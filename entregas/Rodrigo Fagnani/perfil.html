<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | FixAqui</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
    <header class="site-header">
        <a class="brand" href="login.html" aria-label="FixAqui - página inicial">FixAqui</a>
        <nav class="main-nav" aria-label="Navegação principal">
            <a class="nav-link" href="login.html">Entrar</a>
            <a class="nav-link nav-link-active" href="perfil.html">Criar conta</a>
            <a class="nav-link" href="dashboard.html">Explorar serviços</a>
        </nav>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="cadastro-title">
            <div class="auth-heading">
                <span class="eyebrow">Comece no FixAqui</span>
                <h1 id="cadastro-title">Crie a sua conta</h1>
                <p>Cadastre-se para encontrar profissionais e solicitar serviços com facilidade.</p>
            </div>

            <form class="form" id="perfil-form" action="perfil.html" method="get" novalidate>
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input class="input" type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" aria-describedby="nome-error" required>
                    <span class="form-error" id="nome-error" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input class="input" type="email" id="email" name="email" placeholder="seuemail@exemplo.com" autocomplete="email" aria-describedby="email-error" required>
                    <span class="form-error" id="email-error" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input class="input" type="password" id="senha" name="senha" placeholder="Crie uma senha (mínimo de 8 caracteres)" autocomplete="new-password" aria-describedby="senha-error" required>
                    <span class="form-error" id="senha-error" aria-live="polite"></span>
                </div>

                <div class="form-group">
                    <label for="confirmar-senha">Confirme sua senha</label>
                    <input class="input" type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite a senha novamente" autocomplete="new-password" aria-describedby="confirmar-senha-error" required>
                    <span class="form-error" id="confirmar-senha-error" aria-live="polite"></span>
                </div>

                <button class="button button-primary button-full" type="submit">Criar conta</button>
            </form>
            <section class="account-summary" id="account-summary" aria-live="polite" hidden>
                <span class="eyebrow">Perfil do cliente</span>
                <h2 id="profile-name"></h2>
                <p id="profile-email"></p>
                <button class="button button-outline button-full" id="edit-profile" type="button">Editar cadastro</button>
                <a class="button button-primary button-full" href="dashboard.html">Explorar profissionais</a>
            </section>

            <p class="auth-footer-text">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 FixAqui. Projeto acadêmico.</p>
    </footer>
    <script src="js/script.js" defer></script>
</body>
</html>
